bundle:
  name: quant-derivatives-lakehouse

include:
  - resources/*.yml

artifacts:
  quant_lakehouse_artifact:
    type: whl
    build: python -m build --wheel

# Synchronisations-Filter für den Code-Upload in den Workspace
sync:
  exclude:
    - .env
    - .git/
    - .venv/
    - .pytest_cache/
    - .ruff_cache/
    - data/
    - tests/

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-f67052a4-d0c8.cloud.databricks.com
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://dbc-f67052a4-d0c8.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}


variables:
  environment:
    description: "Deployment environment target"
    default: "dev"

