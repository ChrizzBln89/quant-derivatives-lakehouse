resources:
  jobs:
    derivatives_pricing_pipeline:
      name: "[${bundle.target}] derivatives_pricing_pipeline"
      
      timeout_seconds: 3600
      max_concurrent_runs: 1
      
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Berlin"
        pause_status: PAUSED

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        # Task 1: Ingestion & Raw Landing
        - task_key: run_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/entrypoints/run_bronze.py

        # Task 2: Cleaning & Volatility Calibration
        - task_key: run_silver
          depends_on:
            - task_key: run_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/entrypoints/run_silver.py

        # Task 3: Vectorized Arrow UDF Black-Scholes Valuation
        - task_key: run_gold
          depends_on:
            - task_key: run_silver
          environment_key: default
          spark_python_task:
            python_file: ../src/entrypoints/run_gold.py

      email_notifications:
        on_failure:
          - "${workspace.current_user.userName}"
